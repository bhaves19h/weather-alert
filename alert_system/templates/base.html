<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Weather Intelligence System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
    }

    body{
        min-height:100vh;
        color:white;
        overflow-x:hidden;
        background:#0f172a;
    }

    /* Animated Background */

    body::before{
        content:'';
        position:fixed;
        inset:0;
        z-index:-2;

        background:
        linear-gradient(
            -45deg,
            #0f172a,
            #1e3a8a,
            #2563eb,
            #0ea5e9
        );

        background-size:400% 400%;
        animation:gradient 15s ease infinite;
    }

    @keyframes gradient{
        0%{
            background-position:0% 50%;
        }

        50%{
            background-position:100% 50%;
        }

        100%{
            background-position:0% 50%;
        }
    }

    /* Floating Glow */

    body::after{
        content:'';
        position:fixed;
        width:350px;
        height:350px;
        border-radius:50%;
        background:rgba(255,255,255,0.08);
        top:10%;
        right:5%;
        filter:blur(70px);
        z-index:-1;
    }

    /* Navbar */

    .glass-nav{
        background:rgba(255,255,255,0.08);
        backdrop-filter:blur(15px);
        border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .navbar-brand{
        font-size:1.5rem;
        font-weight:700;
    }

    /* Glass Cards */

    .glass-card{

        background:rgba(255,255,255,0.08);

        backdrop-filter:blur(15px);

        border:1px solid rgba(255,255,255,0.15);

        border-radius:25px;

        padding:25px;

        width:100%;

        height:100%;

        box-shadow:
        0 8px 32px rgba(0,0,0,0.3);

        transition:all 0.3s ease;
    }

    .glass-card:hover{

        transform:translateY(-8px);

        box-shadow:
        0 15px 40px rgba(0,0,0,0.4);
    }

    /* Login/Register */

    .auth-card{

        max-width:500px;

        margin:auto;

        margin-top:80px;
    }

    /* Inputs */

    .form-control{

        background:rgba(255,255,255,0.08);

        border:none;

        color:white;

        padding:14px;

        border-radius:12px;
    }

    .form-control::placeholder{
        color:#cbd5e1;
    }

    .form-control:focus{

        background:rgba(255,255,255,0.15);

        color:white;

        box-shadow:none;
    }

    /* Buttons */

    .btn-weather{

        width:100%;

        background:linear-gradient(
            45deg,
            #3b82f6,
            #06b6d4
        );

        border:none;

        padding:12px;

        font-weight:600;

        border-radius:12px;

        color:white;
    }

    .btn-weather:hover{

        transform:scale(1.03);
    }

    /* Dashboard */

    .dashboard-title{

        font-size:2.5rem;

        font-weight:700;

        margin-bottom:10px;
    }

    /* Equal Height Bootstrap Cards */

    .row.g-4 > div{
        display:flex;
    }

.row > .col{
    display:flex;
}

.metric-card{
    width:100%;
    min-height:250px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.glass-card{
    width:100%;
}
    .metric-card i{

        font-size:3rem;

        margin-bottom:15px;

        color:#38bdf8;
    }

    .metric-value{

        font-size:2rem;

        font-weight:700;

        margin-bottom:10px;
    }

    .metric-title{

        color:#cbd5e1;

        font-size:1rem;
    }

    .badge{

        margin-top:10px;

        padding:8px 14px;

        border-radius:10px;

        font-size:0.9rem;
    }

    /* Chart Container */

    .chart-container{

        height:400px;
    }

    canvas{
        width:100% !important;
    }
    .table{

border-radius:15px;

overflow:hidden;
}

.table td,
.table th{

vertical-align:middle;
}
    /* Responsive */

    @media(max-width:768px){

        .dashboard-title{
            font-size:1.8rem;
        }

        .metric-card{
            height:220px;
        }

        .metric-value{
            font-size:1.7rem;
        }

        .metric-card i{
            font-size:2.4rem;
        }

        .auth-card{
            margin-top:40px;
        }
    }

</style>
```

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark glass-nav">

```
<div class="container">

    <a class="navbar-brand" href="#">
        🌦 Weather Intelligence
    </a>

    <div class="ms-auto">

        {% if session.get('user_id') %}
        <a href="/logout" class="btn btn-danger">
            Logout
        </a>
        {% endif %}

    </div>

</div>
```

</nav>

<div class="container py-5">

```
{% block content %}
    <script>

const labels = [

{% for item in history %}
"{{ item.created_at.strftime('%H:%M') }}",
{% endfor %}

];

const temperatures = [

{% for item in history %}
{{ item.temperature }},
{% endfor %}

];

const humidities = [

{% for item in history %}
{{ item.humidity }},
{% endfor %}

];

const aqi = [

{% for item in history %}
{{ item.aqi }},
{% endfor %}

];

new Chart(
document.getElementById(
'weatherChart'
),
{
type:'line',

data:{

labels:labels,

datasets:[

{
label:'Temperature',
data:temperatures,
borderWidth:3
},

{
label:'Humidity',
data:humidities,
borderWidth:3
},

{
label:'AQI',
data:aqi,
borderWidth:3
}

]

},

options:{
responsive:true
}

}
);

</script>
{% endblock %}
```

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
